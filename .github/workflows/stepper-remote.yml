name: Stepper Remote

on:
  pull_request:
    paths:
      - "stepper-remote/**"
      - "scripts/run_stepper_remote_web.sh"
      - ".github/workflows/stepper-remote.yml"
  push:
    branches:
      - master
    paths:
      - "stepper-remote/**"
      - "scripts/run_stepper_remote_web.sh"
      - ".github/workflows/stepper-remote.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stepper-remote-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Install backend dependencies
        working-directory: stepper-remote/backend
        run: npm ci
      - name: Install frontend dependencies
        working-directory: stepper-remote/frontend
        run: npm ci
      - name: Test backend
        working-directory: stepper-remote/backend
        run: npm test
      - name: Test frontend
        working-directory: stepper-remote/frontend
        run: npm test
      - name: Build backend
        working-directory: stepper-remote/backend
        run: npm run build
      - name: Build frontend
        working-directory: stepper-remote/frontend
        run: npm run build
