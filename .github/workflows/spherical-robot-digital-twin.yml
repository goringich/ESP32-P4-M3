name: Spherical Robot Digital Twin

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "README.md"
      - "mechanical/spherical_robot/**"
      - ".github/workflows/spherical-robot-digital-twin.yml"
  push:
    branches:
      - master
    paths:
      - "AGENTS.md"
      - "README.md"
      - "mechanical/spherical_robot/**"
      - ".github/workflows/spherical-robot-digital-twin.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify dependency-free engineering baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m unittest discover -s mechanical/spherical_robot/tests -p 'test_*.py'
          python mechanical/spherical_robot/calculations.py --json >/tmp/spherical-sizing.json
          python mechanical/spherical_robot/simulation/run_sweep.py --output /tmp/spherical-sweep.json
          python mechanical/spherical_robot/simulation/mujoco_model.py --output /tmp/spherical-robot.xml
          python -m json.tool /tmp/spherical-sizing.json >/dev/null
          python -m json.tool /tmp/spherical-sweep.json >/dev/null
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          ElementTree.parse(Path("/tmp/spherical-robot.xml"))
          PY
          git diff --check

  mujoco:
    name: Execute MuJoCo 3.13.0
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned primary solver
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --no-input             -r mechanical/spherical_robot/simulation/requirements-simulation.txt
      - name: Execute primary multibody scenario matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          python mechanical/spherical_robot/simulation/run_mujoco.py             --output /tmp/mujoco-evidence.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/mujoco-evidence.json").read_text())
          assert report["status"] == "PASS", report
          assert report["evidence_state"] == "PRIMARY_MULTIBODY_PASS", report
          assert report["backend"]["version"] == "3.13.0", report
          assert report["scenario_count"] == 27, report
          assert report["failed_scenario_indexes"] == [], report
          assert report["symmetry_check"]["passed"] is True, report
          assert report["physical_accepted"] is False, report
          assert report["unresolved_inputs"], report
          PY
          git diff --check

  chrono-crosscheck:
    name: Cross-check Project Chrono 10.0.0
    needs: mujoco
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          activate-environment: chrono
          python-version: "3.12"
          channels: conda-forge,projectchrono
      - name: Install pinned independent solver
        run: |
          set -Eeuo pipefail
          conda install --yes projectchrono::pychrono=10.0.0 -c conda-forge
          python -m pip install --disable-pip-version-check --no-input \
            -r mechanical/spherical_robot/simulation/requirements-simulation.txt
      - name: Execute independent cross-check
        run: |
          set -Eeuo pipefail
          python mechanical/spherical_robot/simulation/run_mujoco.py \
            --output /tmp/mujoco-evidence.json
          python mechanical/spherical_robot/simulation/run_chrono.py \
            --output /tmp/chrono-evidence.json
          python mechanical/spherical_robot/simulation/compare_multibody.py \
            --mujoco /tmp/mujoco-evidence.json \
            --chrono /tmp/chrono-evidence.json \
            --output /tmp/multibody-crosscheck.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/multibody-crosscheck.json").read_text())
          assert report["status"] == "PASS", report
          assert report["evidence_state"] == "INDEPENDENT_DYNAMICS_CROSSCHECK_PASS", report
          assert report["metrics"]["scenario_count"] == 27, report
          assert report["metrics"]["direction_agreement_fraction"] >= 0.95, report
          assert report["physical_accepted"] is False, report
          PY
          git diff --check
