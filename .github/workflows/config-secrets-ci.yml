name: Firmware Config Secrets

on:
  pull_request:
    paths:
      - "sdkconfig.defaults"
      - ".gitignore"
      - "sdkconfig"
      - "build/config/sdkconfig.h"
      - "build/config/sdkconfig.cmake"
      - "build/config/sdkconfig.json"
      - ".github/workflows/config-secrets-ci.yml"
  push:
    branches:
      - master
    paths:
      - "sdkconfig.defaults"
      - ".gitignore"
      - "sdkconfig"
      - "build/config/sdkconfig.h"
      - "build/config/sdkconfig.cmake"
      - "build/config/sdkconfig.json"
      - ".github/workflows/config-secrets-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify local Wi-Fi credentials cannot return
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "$(git ls-files sdkconfig build/config/sdkconfig.h build/config/sdkconfig.cmake build/config/sdkconfig.json)"
          ! git grep -n -E 'CONFIG_APP_WIFI_(SSID|PASSWORD)(_SECONDARY)?="[^"]+"' -- sdkconfig.defaults
          grep -q '^# CONFIG_APP_WIFI_CONNECT is not set$' sdkconfig.defaults
          grep -q '^sdkconfig$' .gitignore
          grep -q '^build/$' .gitignore
