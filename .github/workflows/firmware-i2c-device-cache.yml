name: Firmware I2C Device Cache

on:
  pull_request:
    paths:
      - "components/i2c_bus/**"
      - "tests/test_i2c_bus_handle_cache.py"
      - ".github/workflows/firmware-i2c-device-cache.yml"
  push:
    branches:
      - master
    paths:
      - "components/i2c_bus/**"
      - "tests/test_i2c_bus_handle_cache.py"
      - ".github/workflows/firmware-i2c-device-cache.yml"

permissions:
  contents: read

jobs:
  i2c-handle-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile and exercise I2C device lifecycle against mocks
        run: python3 -m unittest discover -s tests -p 'test_i2c_bus_handle_cache.py' -v
